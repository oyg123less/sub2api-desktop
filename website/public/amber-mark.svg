<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>Amber</title>
  <defs>
    <!-- Dark Obsidian Gradient -->
    <linearGradient id="markBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c2c" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Golden Crystal Gradient Left -->
    <linearGradient id="facetGoldL" x1="16" y1="12" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Deep Amber Gradient Right -->
    <linearGradient id="facetGoldR" x1="32" y1="12" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Core Laser Filter -->
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#markBg)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2" />
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Ambient Light Reflection -->
  <circle cx="32" cy="33" r="15" fill="#f59e0b" fill-opacity="0.18" />

  <!-- Architectural Gateway 'A' - Left Facet -->
  <path d="M 32 13.5 L 17 48.5 L 25.5 48.5 L 32 32 Z" fill="url(#facetGoldL)" />

  <!-- Architectural Gateway 'A' - Right Facet -->
  <path d="M 32 13.5 L 38.5 32 L 47 48.5 L 38.5 48.5 Z" fill="url(#facetGoldR)" />

  <!-- High-Energy Gateway Bridge -->
  <rect x="23" y="36.5" width="18" height="4.5" rx="2.25" fill="#ffffff" filter="url(#markGlow)" />
  <circle cx="32" cy="38.75" r="2.5" fill="#fbbf24" />
  <circle cx="32" cy="38.75" r="1.2" fill="#ffffff" />
</svg>
